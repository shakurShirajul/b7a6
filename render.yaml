# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: blood-donation-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: corepack enable && corepack prepare pnpm@10.20.0 --activate && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:deploy
    startCommand: node dist/src/server.js
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: blood-donation-postgres
          property: connectionString
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_QUERY_TIMEOUT_MS
        value: "15000"
      - key: REDIS_URL
        fromService:
          name: blood-donation-redis
          type: keyvalue
          property: connectionString
      - key: APP_URL
        fromService:
          name: blood-donation-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: JWT_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: JWT_REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_TOKEN_EXPIRATION
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GOOGLE_OAUTH_STATE_SECRET
        generateValue: true
      - key: READINESS_TIMEOUT_MS
        value: "1500"
      - key: REDIS_COMMAND_TIMEOUT_MS
        value: "1500"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: BDT
      - key: PAYMENT_MIN_MINOR_UNITS
        value: "100"
      - key: PAYMENT_MAX_MINOR_UNITS
        value: "99999999"

  - type: worker
    name: blood-donation-worker
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: corepack enable && corepack prepare pnpm@10.20.0 --activate && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:deploy
    startCommand: node dist/src/jobs/worker.js
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: blood-donation-postgres
          property: connectionString
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_QUERY_TIMEOUT_MS
        value: "15000"
      - key: REDIS_URL
        fromService:
          name: blood-donation-redis
          type: keyvalue
          property: connectionString
      - key: APP_URL
        fromService:
          name: blood-donation-api
          type: web
          envVarKey: APP_URL
      - key: CORS_ORIGINS
        fromService:
          name: blood-donation-api
          type: web
          envVarKey: CORS_ORIGINS
      - key: TRUST_PROXY_HOPS
        value: "0"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: JWT_ACCESS_TOKEN_SECRET
        fromService:
          name: blood-donation-api
          type: web
          envVarKey: JWT_ACCESS_TOKEN_SECRET
      - key: JWT_REFRESH_TOKEN_SECRET
        fromService:
          name: blood-donation-api
          type: web
          envVarKey: JWT_REFRESH_TOKEN_SECRET
      - key: JWT_ACCESS_TOKEN_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_TOKEN_EXPIRATION
        value: 7d
      - key: READINESS_TIMEOUT_MS
        value: "1500"
      - key: REDIS_COMMAND_TIMEOUT_MS
        value: "1500"
      - key: STRIPE_SECRET_KEY
        fromService:
          name: blood-donation-api
          type: web
          envVarKey: STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
        fromService:
          name: blood-donation-api
          type: web
          envVarKey: STRIPE_WEBHOOK_SECRET
      - key: STRIPE_CURRENCY
        value: BDT
      - key: PAYMENT_MIN_MINOR_UNITS
        value: "100"
      - key: PAYMENT_MAX_MINOR_UNITS
        value: "99999999"

  - type: keyvalue
    name: blood-donation-redis
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: blood-donation-postgres
    region: singapore
    plan: 0.1c-256mb
    databaseName: blood_donation
    user: blood_donation
    ipAllowList: []
